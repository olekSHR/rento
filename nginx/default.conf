geo $cf_allowed {
    default 0;
    127.0.0.1/32 1;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

upstream rento_frontend {
    server frontend:3000;
}

upstream rento_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name rentonow.ro www.rentonow.ro;

    if ($cf_allowed = 0) {
        return 403;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://rentonow.ro$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.rentonow.ro;

    if ($cf_allowed = 0) {
        return 403;
    }

    ssl_certificate /etc/ssl/cloudflare/rentonow.ro-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/rentonow.ro-origin.key;

    return 301 https://rentonow.ro$request_uri;
}

server {
    listen 443 ssl;
    server_name rentonow.ro;

    if ($cf_allowed = 0) {
        return 403;
    }

    client_max_body_size 25m;

    ssl_certificate /etc/ssl/cloudflare/rentonow.ro-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/rentonow.ro-origin.key;

    location /api/ {
        proxy_pass http://rento_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://rento_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

upstream rento_frontend {
    server frontend:3000;
}

upstream rento_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name rentonow.ro www.rentonow.ro;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://rentonow.ro$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.rentonow.ro;

    ssl_certificate /etc/ssl/cloudflare/rentonow.ro-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/rentonow.ro-origin.key;

    return 301 https://rentonow.ro$request_uri;
}

server {
    listen 443 ssl;
    server_name rentonow.ro;

    client_max_body_size 25m;

    ssl_certificate /etc/ssl/cloudflare/rentonow.ro-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/rentonow.ro-origin.key;

    location /api/ {
        proxy_pass http://rento_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://rento_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

services:
  db:
    image: postgres:16
    container_name: rento_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rento_db}
      POSTGRES_USER: ${POSTGRES_USER:-rento_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in a local environment file or shell}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-rento_user} -d $${POSTGRES_DB:-rento_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend

    container_name: rento_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rento_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-rento_db}

    volumes:
      - ./backend/uploads:/app/uploads

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}

    container_name: rento_frontend
    restart: unless-stopped

    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      INTERNAL_API_URL: http://backend:8000

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    container_name: rento_nginx
    restart: unless-stopped

    ports:
      - "${NGINX_HTTP_PORT:-80}:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
